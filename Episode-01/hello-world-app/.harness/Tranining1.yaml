pipeline:
  stages:
    - steps:
        - name: GitClone_Buildstep1
          id: GitClone_Buildstep1
          build:
            uses: gitCloneStep
            with:
              connector: Github_Connector_Training1
              repo_name: https://github.com/chaitanyarudraraju/Understanding_Harness
              build:
                target: Git Branch
                branch: master
              pr_merge_strategy: Source Branch
              depth: "50"
              lfs_enabled: false
              debug: false
              fetch_tags: false
              insecure: false
        - name: Step2_harnesscodeclone
          id: Step2_harnesscodeclone
          build:
            uses: harnessCodeCloneStep
            with:
              build:
                target: Git Branch
                branch: master
              pr_merge_strategy: Source Branch
              depth: "50"
              lfs_enabled: false
              debug: false
              fetch_tags: false
              insecure: false
        - name: Run_Step3
          run:
            shell: sh
            script: "echo \"=== Building Hello World ===\"\r

              cd Episode-01/hello-world-app\r

              mvn clean package -q\r

              echo \"\"\r

              echo \"=== Running the App ===\"\r

              java -jar target/hello-world-1.0.0.jar\r

              echo \"\"\r

              echo \"=== Pipeline Success! ===\""
          id: Run_Step3
